<!DOCTYPE html>
<html>
<head>
  <title>Event Setup</title>
  <!-- <link rel="stylesheet" href="style.css"> -->

  <link rel="stylesheet" href="style.css"></link>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #eef1fb;
      padding: 24px;
    }

    .layout {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .box {
      width: 100%;
      max-width: 480px;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 36px 34px 30px;
      box-shadow:
        0 1px 2px rgba(0,0,0,0.04),
        0 8px 32px rgba(99,102,241,0.10),
        0 32px 64px rgba(0,0,0,0.07);
    }

    h2 {
      font-size: 1.45rem;
      font-weight: 700;
      color: #111827;
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 0.88rem;
      color: #6b7280;
      margin-bottom: 22px;
    }

    input {
      width: 100%;
      padding: 13px 16px;
      margin-bottom: 14px;
      background: #f9fafb;
      border: 1.5px solid #e5e7eb;
      border-radius: 10px;
      font-size: 0.92rem;
      outline: none;
      transition: 0.2s ease;
    }

    input:focus {
      border-color: #6366f1;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(99,102,241,0.08);
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 4px;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      border: none;
      border-radius: 11px;
      color: #ffffff;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 16px rgba(99,102,241,0.35);
      transition: transform 0.15s ease;
    }

    button:hover {
      transform: translateY(-2px);
    }

    canvas{
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

/* // Loader styling */

/* ===== LOADER OVERLAY ===== */
.loader-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(15, 23, 42, 0.6);
  backdrop-filter: blur(6px);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 999;
}

.loader-box {
  background: white;
  padding: 30px 40px;
  border-radius: 16px;
  text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

.loader-box p {
  margin-top: 12px;
  font-weight: 600;
  color: #4f46e5;
}

/* Spinner */
.spinner {
  width: 40px;
  height: 40px;
  border: 4px solid #e5e7eb;
  border-top: 4px solid #6366f1;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to {
    transform: rotate(360deg);
  }
}
  </style>
</head>
<body>
    <canvas id="crowd"></canvas>

<div class="layout">
  <div class="box">
    <h2>Form (Event Details)</h2>
    <p class="subtitle">Configure event information before initializing the crowd monitoring database.</p>

    <input type="text" id="eventName" placeholder="Event Name">
    <input type="number" id="zones" placeholder="Number of Zones">
    <input type="text" id="capacity" placeholder="Capacity (comma separated: 1000,1200,800)">

    <button onclick="initialize()">Link Database</button>
  </div>
</div>

<script>
  document.querySelectorAll('input').forEach(input => {
    input.addEventListener('focus', () => {
      input.setAttribute('data-active', 'true');
    });

    input.addEventListener('blur', () => {
      if (!input.value.trim()) {
        input.removeAttribute('data-active');
      }
    });
  });
</script>

<script src="script.js"></script>

<script>
const canvas = document.getElementById('crowd');
const ctx = canvas.getContext('2d');

function resize(){
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

function rand(a, b){
  return a + Math.random() * (b - a);
}

function drawWalkingHuman(phase, s, dir){
  const legSwing = Math.sin(phase) * 18;
  const armSwing = -Math.sin(phase) * 22;
  const bodyBob = Math.abs(Math.sin(phase)) * (s * 0.4);

  ctx.save();
  if (dir === -1) ctx.scale(-1, 1);

  const toRad = d => d * Math.PI / 180;
  const bobY = bodyBob;

  // head
  ctx.beginPath();
  ctx.ellipse(0, -s * 5.2 + bobY, s * 0.72, s * 0.82, 0, 0, Math.PI * 2);
  ctx.fill();

  // neck
  ctx.fillRect(-s * 0.2, -s * 4.35 + bobY, s * 0.4, s * 0.5);

  // torso
  ctx.beginPath();
  ctx.moveTo(-s * 0.75, -s * 3.85 + bobY);
  ctx.lineTo(s * 0.75, -s * 3.85 + bobY);
  ctx.lineTo(s * 0.55, -s * 1.6 + bobY);
  ctx.lineTo(-s * 0.55, -s * 1.6 + bobY);
  ctx.closePath();
  ctx.fill();

  // left arm
  ctx.save();
  ctx.translate(-s * 0.72, -s * 3.7 + bobY);
  ctx.rotate(toRad(-armSwing));
  ctx.beginPath();
  ctx.ellipse(-s * 0.18, s * 1.0, s * 0.28, s * 1.1, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // right arm
  ctx.save();
  ctx.translate(s * 0.72, -s * 3.7 + bobY);
  ctx.rotate(toRad(armSwing));
  ctx.beginPath();
  ctx.ellipse(s * 0.18, s * 1.0, s * 0.28, s * 1.1, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // hips
  ctx.beginPath();
  ctx.ellipse(0, -s * 1.45 + bobY, s * 0.6, s * 0.35, 0, 0, Math.PI * 2);
  ctx.fill();

  // left leg
  ctx.save();
  ctx.translate(-s * 0.35, -s * 1.2 + bobY);
  ctx.rotate(toRad(-legSwing));
  ctx.beginPath();
  ctx.ellipse(0, s * 0.9, s * 0.32, s * 1.0, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.save();
  ctx.translate(0, s * 1.8);
  ctx.rotate(toRad(legSwing * 0.6));
  ctx.beginPath();
  ctx.ellipse(0, s * 0.8, s * 0.26, s * 0.95, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.translate(s * 0.05, s * 1.6);
  ctx.beginPath();
  ctx.ellipse(s * 0.2, 0, s * 0.55, s * 0.2, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  ctx.restore();

  // right leg
  ctx.save();
  ctx.translate(s * 0.35, -s * 1.2 + bobY);
  ctx.rotate(toRad(legSwing));
  ctx.beginPath();
  ctx.ellipse(0, s * 0.9, s * 0.32, s * 1.0, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.save();
  ctx.translate(0, s * 1.8);
  ctx.rotate(toRad(-legSwing * 0.6));
  ctx.beginPath();
  ctx.ellipse(0, s * 0.8, s * 0.26, s * 0.95, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.translate(s * 0.05, s * 1.6);
  ctx.beginPath();
  ctx.ellipse(s * 0.2, 0, s * 0.55, s * 0.2, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  ctx.restore();

  ctx.restore();
}

const COUNT = 80;

const people = Array.from({ length: COUNT }, () => {
  const dir = Math.random() < 0.5 ? 1 : -1;
  return {
    x: rand(0, window.innerWidth),
    y: rand(window.innerHeight * 0.12, window.innerHeight * 0.9),
    speed: rand(0.25, 0.7),
    dir,
    s: rand(3.2, 5.6),
    phase: rand(0, Math.PI * 2),
    opacity: rand(0.4, 0.14),
  };
});

let last = 0;

function animate(ts){
  const dt = Math.min(ts - last, 32) / 16;
  last = ts;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (const p of people){
    p.x += p.speed * p.dir * dt;
    p.phase += 0.055 * dt;

    if (p.x > canvas.width + 30) p.x = -30;
    if (p.x < -30) p.x = canvas.width + 30;

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.globalAlpha = p.opacity;
    ctx.fillStyle = '#4338ca';
    drawWalkingHuman(p.phase, p.s, p.dir);
    ctx.restore();
  }

  requestAnimationFrame(animate);
}

requestAnimationFrame(animate);

async function initialize() {
  const zones = document.getElementById("zones").value;
  const capacityInput = document.getElementById("capacity").value;

  const capacity = capacityInput
    .split(",")
    .map(num => Number(num.trim()))
    .filter(num => !isNaN(num));

  if (capacity.length !== Number(zones)) {
    alert("Capacity count must match number of zones");
    return;
  }

  const loader = document.getElementById("loaderOverlay");

  try {
    // ✅ show loader only if exists (form page)
    if (loader) loader.style.display = "flex";

    const res = await fetch("http://127.0.0.1:5000/api/event/initialize", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        zones: Number(zones),
        capacity
      })
    });

    const data = await res.json();

    if (loader) loader.style.display = "none";

    if (!res.ok) {
      alert("Backend error: " + JSON.stringify(data));
      return;
    }

    // alert("Database Linked Successfully");
    window.location.href = "dashboard.html";

  } catch (err) {
    if (loader) loader.style.display = "none";
    console.log(err);
    alert("Server not reachable");
  }
}
</script>

<div id="loaderOverlay" class="loader-overlay">
  <div class="loader-box">
    <div class="spinner"></div>
    <p>Linking Database...</p>
  </div>
</div>

<!-- POPUP -->

<div id="toastContainer" class="toast-container"></div>

</body>
</html>
